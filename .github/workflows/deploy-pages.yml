name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          # Project sites are served from https://<user>.github.io/<repo>/ —
          # the base path must be baked into the bundle and asset URLs.
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
          STATIC_EXPORT: "true"
        run: |
          BASE_PATH="${BASE_PATH//\/\//\/}"
          echo "Building with base path: $BASE_PATH"
          BASE_PATH="$BASE_PATH" bun run build
      - name: Add SPA fallback + disable Jekyll
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
